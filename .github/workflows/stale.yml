name: Stale Issues & PRs

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue configuration
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.
            It will be closed in 7 days if no further activity occurs.

            If this issue is still relevant, please comment or remove the stale label.
            Thank you for your contributions!
          close-issue-message: |
            This issue was automatically closed due to inactivity.
            If you believe this issue is still relevant, please reopen it or create a new issue.
          stale-issue-label: "stale"
          days-before-issue-stale: 60
          days-before-issue-close: 7
          exempt-issue-labels: "pinned,security,roadmap,help-wanted,good-first-issue"

          # PR configuration
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.
            It will be closed in 14 days if no further activity occurs.

            If this PR is still relevant, please update it or remove the stale label.
            Thank you for your contributions!
          close-pr-message: |
            This pull request was automatically closed due to inactivity.
            If you would like to continue work on this PR, please reopen it.
          stale-pr-label: "stale"
          days-before-pr-stale: 45
          days-before-pr-close: 14
          exempt-pr-labels: "pinned,security,work-in-progress"

          # General configuration
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: true
